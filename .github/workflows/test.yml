name: 'Test & Dry-Run Release Notes'

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Verify build artifact freshness
        run: |
          npm run build
          git diff --exit-code dist/ || (echo "Error: dist/index.js is out of date. Run 'npm run build' before committing." && exit 1)

      - name: Test Action execution (Dry-Run Mode)
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: 'true'
          llm-api-key: ${{ secrets.LLM_API_KEY }}
